function sequence(a){return a.map(function(v){return v||'-'}).join('')}function grouped(a){var s=sequence(a),out=[];for(var i=0;i<s.length;i+=10)out.push(s.slice(i,i+10));return out.join(' ')}function reportText(e){var r=e.result&&!e.result.stale?e.result:computeResult(e),lines=['GABARITO ONLINE — ESPELHO DA CORREÇÃO','',e.name,'Data: '+fmtDate(e.date),'Formato: '+(e.type==='tf'?'Certo ou Errado':'Múltipla escolha'),'Questões: '+e.count,'Tempo: '+fmtTime(r.time),'','Total avaliado: '+r.evaluated,'Sem gabarito: '+r.noKey,'Acertos: '+r.correct,'Erros: '+r.wrong,'Em branco: '+r.blank,'Percentual: '+r.percent+'%'];if(e.type==='tf')lines.push('Pontuação líquida: '+r.net);lines.push('','Respostas: '+sequence(e.answers),'Gabarito:  '+sequence(e.key),'','COMPARAÇÃO');for(var i=0;i<e.count;i++)lines.push(String(i+1).padStart(3,'0')+' | Sua resposta: '+(e.answers[i]||'—')+' | Gabarito: '+(e.key[i]||'—')+' | '+statusLabel(detail(e,i).status)+(e.flagged[i]?' | Revisar':''));var f=e.flagged.map(function(v,i){return v?i+1:null}).filter(Boolean);lines.push('','Questões para revisão: '+(f.join(', ')||'nenhuma'));return lines.join('\n')}
